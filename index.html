<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudohnim</title>
  <meta name="google-site-verification" content="E_Pe6UE-UhsYs4GHNRGGZE3-8_mEVrTm-F8NxBRQSS4" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Lato', sans-serif;
      background-color: #ffffff;
      color: #1A2E1F;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      display: block;
      height: 6px;
      background: linear-gradient(90deg, #4A9E6F, #7BC47F, #A8D5B5, #7BC47F, #4A9E6F);
    }

    header {
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #E8F5ED;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: #1A2E1F;
      letter-spacing: 0.02em;
    }

    nav a {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6B9E75;
      text-decoration: none;
      margin-left: 28px;
      transition: color 0.2s;
    }
    nav a:hover { color: #1A2E1F; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #A8D5B5;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(56px, 12vw, 120px);
      font-weight: 900;
      line-height: 1;
      color: #1A2E1F;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
    }

    h1 span {
      color: #4A9E6F;
    }

    .tagline {
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 300;
      color: #6B9E75;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 56px;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, #4A9E6F, #A8D5B5);
      border-radius: 2px;
      margin: 0 auto 56px;
    }

    .apps {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .apps-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #A8D5B5;
      margin-bottom: 4px;
    }

    .app-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #F5F5F5;
      border: 1px solid #E0E0E0;
      border-radius: 14px;
      padding: 16px 28px;
      width: 280px;
      text-decoration: none;
      color: #888;
      position: relative;
      filter: grayscale(1);
      opacity: 0.7;
      cursor: default;
    }
    .app-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .app-info { text-align: left; }
    .app-name {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 2px;
      color: #888;
    }
    .app-desc {
      font-size: 12px;
      color: #aaa;
      font-weight: 400;
    }
    .coming-soon {
      position: absolute;
      top: -10px;
      right: 14px;
      background: #4A9E6F;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
    }

    footer {
      padding: 32px 40px;
      text-align: center;
      border-top: 1px solid #E8F5ED;
    }

    footer p {
      font-size: 12px;
      color: #A8D5B5;
      margin-bottom: 10px;
    }

    footer a {
      font-size: 12px;
      color: #6B9E75;
      text-decoration: none;
      margin: 0 12px;
      transition: color 0.2s;
    }
    footer a:hover { color: #1A2E1F; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Sudohnim</div>
    <nav>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </header>

  <main>
    <div class="eyebrow">welcome. everything is great.</div>
    <h1>Hello <span>World!</span></h1>
    <p class="tagline">This is Sudohnim and we do things.</p>
    <div class="divider"></div>

    <div class="apps">
      <div class="apps-label">Our Apps</div>
      <div class="app-card">
        <span class="coming-soon">Coming Soon!</span>
        <div class="app-icon">🤼</div>
        <div class="app-info">
          <div class="app-name">Stance Check</div>
          <div class="app-desc">Drill trainer for wrestlers</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 Sudohnim. All rights reserved.</p>
    <div>
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </div>
  </footer>
</body>
</html>
